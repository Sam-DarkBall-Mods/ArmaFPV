name: Publish existing release to Steam

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: steam-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 -B tools/release_contract.py "$RELEASE_TAG"
          test -n "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".zip"))] | length')" -eq 1
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(. == "SHA256SUMS")] | length')" -eq 1

  publish:
    name: Steam Workshop
    needs: validate
    runs-on: windows-latest
    environment: steam-production
    env:
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download and verify release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $payload = Join-Path $PWD "release-payload"
          New-Item -ItemType Directory -Path $payload | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $payload
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release download failed" }

          $checksumLine = Get-Content (Join-Path $payload "SHA256SUMS") | Select-Object -First 1
          $checksum = $checksumLine.Trim() -split '\s+', 2
          if ($checksum.Count -ne 2) { throw "Invalid SHA256SUMS" }

          $archiveName = $checksum[1].Trim()
          $archive = Join-Path $payload $archiveName
          if (-not (Test-Path -LiteralPath $archive)) { throw "Release archive not found" }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $checksum[0]) { throw "Release checksum mismatch" }

      - name: Require Steam credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STEAM_USERNAME)) { throw "STEAM_USERNAME is required" }
          if ([string]::IsNullOrWhiteSpace($env:STEAM_CONFIG_VDF)) { throw "STEAM_CONFIG_VDF is required" }

      - name: Install SteamCMD
        shell: pwsh
        run: |
          $steamRoot = Join-Path $env:RUNNER_TEMP "steamcmd"
          $steamArchive = Join-Path $env:RUNNER_TEMP "steamcmd.zip"
          New-Item -ItemType Directory -Path $steamRoot | Out-Null
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile $steamArchive
          Expand-Archive -LiteralPath $steamArchive -DestinationPath $steamRoot
          $steamCmd = Join-Path $steamRoot "steamcmd.exe"
          & $steamCmd "+quit"
          if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 5
              & $steamCmd "+quit"
          }
          if ($LASTEXITCODE -ne 0) { throw "SteamCMD setup failed" }

      - name: Restore Steam login token
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "steamcmd\config\config.vdf"
          New-Item -ItemType Directory -Path (Split-Path $configPath) -Force | Out-Null
          [System.IO.File]::WriteAllText($configPath, $env:STEAM_CONFIG_VDF, [System.Text.UTF8Encoding]::new($false))

      - name: Prepare Workshop content
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $archives = @(Get-ChildItem "release-payload" -Filter "*.zip" -File)
          if ($archives.Count -ne 1) { throw "Expected exactly one release archive" }

          $workshopRoot = Join-Path $PWD "workshop-content"
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $workshopRoot
          $content = @(Get-ChildItem $workshopRoot -Directory)
          if ($content.Count -ne 1) { throw "Expected exactly one Workshop content directory" }

          $changeNote = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($changeNote)) { throw "Release changelog is missing" }
          $changeNotePath = Join-Path $env:RUNNER_TEMP "changenote.txt"
          [System.IO.File]::WriteAllText($changeNotePath, ($changeNote -join [Environment]::NewLine), [System.Text.UTF8Encoding]::new($false))

          $vdfPath = Join-Path $env:RUNNER_TEMP "workshop.vdf"
          python -B tools/write_workshop_vdf.py --content $content[0].FullName --output $vdfPath --change-note-file $changeNotePath
          if ($LASTEXITCODE -ne 0) { throw "Workshop VDF generation failed" }

      - name: Upload to Workshop
        shell: pwsh
        run: |
          $steamCmd = Join-Path $env:RUNNER_TEMP "steamcmd\steamcmd.exe"
          $vdfPath = Join-Path $env:RUNNER_TEMP "workshop.vdf"
          & $steamCmd "+login" $env:STEAM_USERNAME "+workshop_build_item" $vdfPath "+quit"
          if ($LASTEXITCODE -ne 0) { throw "Steam Workshop upload failed" }
