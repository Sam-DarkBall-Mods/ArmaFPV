name = "ArmaFPV"
prefix = "ArmaFPV"
mainprefix = "z"
author = "DarkBall, Sam, and contributors"

[files]
include = [
    "logo128.paa",
    "logo64.paa",
    "meta.cpp",
    "mod.cpp",
]

exclude = [
    "**/.DS_Store",
    "**/Thumbs.db",
    "**/*.bak",
    "**/*.bak.*",
    "**/*.back.*",
    "**/*.tmp",
    "**/*.orig",
    "**/*.rej",
    "**/* - Copy.*",
    "**/*.psd",
    "**/*.psb",
    "**/*.xcf",
    "**/*.blend",
    "**/*.blend1",
    "**/.gitkeep",
    "addons/**/README*",
    "optionals/**/README*",
]

[properties]
author = "DarkBall, Sam, and contributors"
url = "https://github.com/Sam-DarkBall-Mods/ArmaFPV"

[version]
major = 1
minor = 0
patch = 0
git_hash = 0

[hemtt.build]
pdrive = "disallow"
optional_mod_folders = true

[hemtt.launch.default]
workshop = [
    "450814997", # CBA_A3
]
binarize = true

[hemtt.release]
folder = "ArmaFPV"

[signing]
authority = "db_armafpv"
